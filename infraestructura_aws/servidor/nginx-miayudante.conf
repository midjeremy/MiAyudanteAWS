server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/ubuntu/MiAyudanteAWS/frontend;
    index index.php;

    location = / {
        return 302 /templates/index.php;
    }

    # Estáticos del admin de Django (los de PHP se sirven desde frontend/static)
    location /django-static/ {
        alias /home/ubuntu/MiAyudanteAWS/backend_api/staticfiles/;
    }

    # ------------------------------------------------------------------------
    # RESTRICCIÓN DE ADMIN (DESACTIVADA): quitar los # de este bloque para activarla.
    # Bloquea /admin/ desde internet. Para entrar, abrir un túnel desde el PC:
    #   ssh -i labsuser.pem -L 8080:127.0.0.1:80 ubuntu@IP_DEL_SERVIDOR
    # y usar http://localhost:8080/admin/ mientras el túnel siga abierto.
    # $http_host conserva el puerto del túnel; sin eso Django rechaza el login por CSRF.
    # ------------------------------------------------------------------------
    # location ^~ /admin/ {
    #     allow 127.0.0.1;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $http_host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ------------------------------------------------------------------------
    # API INTERNA (DESACTIVADA): activar solo cuando PHP ya consuma la API.
    # PHP llama directo a 127.0.0.1:8000, así que este bloqueo no lo afecta.
    # ------------------------------------------------------------------------
    # location ^~ /api/ {
    #     deny all;
    # }

    # Solo se publica lo necesario de Django. /api/chatbot/ queda interno: PHP lo llama por 127.0.0.1.
    location ~ ^/(admin|api/v1)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
