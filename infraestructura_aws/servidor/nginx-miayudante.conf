# Versión HTTP: se usa mientras no haya dominio o certificado.
# Con certificado, el deploy usa nginx-miayudante-https.conf.
# Sin HTTPS no se cambia la configuración de cookies de PHP
map $scheme $miayudante_php_value {
    default "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Validación de Let's Encrypt al pedir el certificado
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include snippets/miayudante-app.conf;
}
