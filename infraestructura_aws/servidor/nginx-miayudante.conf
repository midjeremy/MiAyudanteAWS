server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/ubuntu/MiAyudanteAWS/frontend;
    index index.php;

    location = / {
        return 302 /templates/index.php;
    }

    # Estáticos del admin de Django (los de PHP se sirven desde frontend/static)
    location /django-static/ {
        alias /home/ubuntu/MiAyudanteAWS/backend_api/staticfiles/;
    }

    # Solo se publica lo necesario de Django. /api/chatbot/ queda interno: PHP lo llama por 127.0.0.1.
    location ~ ^/(admin|api/v1)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
