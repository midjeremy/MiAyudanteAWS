# Rutas del sitio, compartidas por la versión HTTP y la HTTPS.
# El deploy copia este archivo a /etc/nginx/snippets/miayudante-app.conf.

root /home/ubuntu/MiAyudanteAWS/frontend;
index index.php;

location = / {
    return 302 /templates/index.php;
}

# CSS e imágenes del sitio: el navegador confirma en cada visita si cambiaron.
# Sin esto puede seguir usando una versión anterior después de un deploy.
location /static/ {
    add_header Cache-Control "no-cache";
}

# Estáticos del admin de Django (los de PHP se sirven desde frontend/static)
location /django-static/ {
    alias /home/ubuntu/MiAyudanteAWS/backend_api/staticfiles/;
}

# Solo se publica lo necesario de Django. /api/chatbot/ queda interno: PHP lo llama por 127.0.0.1.
# /health y /health/deep son para el monitoreo de disponibilidad (SLA 01).
location ~ ^/((admin|api/v1)/|health(/deep)?$) {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    # PHP habla con Django por dentro del servidor, sin pasar por Nginx ni por HTTPS
    fastcgi_param MIAYUDANTE_API_URL http://127.0.0.1:8000;
    # Definido en el archivo del sitio: vacío en HTTP, cookies seguras en HTTPS
    fastcgi_param PHP_VALUE $miayudante_php_value if_not_empty;
}

location ~ /\. {
    deny all;
}

location / {
    try_files $uri $uri/ =404;
}
