# Versión HTTPS. El deploy reemplaza __DOMINIOS__ (ej. "miayudante.cl www.miayudante.cl")
# y __CERTIFICADO__ (el nombre del certificado de Let's Encrypt).

# Cookies de sesión de PHP solo por HTTPS y fuera del alcance de JavaScript
# (se aplica en el bloque de PHP de miayudante-app.conf)
map $scheme $miayudante_php_value {
    default "session.cookie_secure=1
session.cookie_httponly=1";
}

# Todo lo que llega por HTTP se redirige a HTTPS (salvo la validación de Let's Encrypt)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__CERTIFICADO__$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name __DOMINIOS__;

    ssl_certificate     /etc/letsencrypt/live/__CERTIFICADO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERTIFICADO__/privkey.pem;

    # Solo TLS 1.3, como exige el informe (SLA 05)
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:MiAyudanteSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # El navegador recuerda que el sitio va siempre por HTTPS (180 días)
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;

    include snippets/miayudante-app.conf;
}
