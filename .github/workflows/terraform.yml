name: Validar Infraestructura (Terraform)
on:
  # Corre en TODOS los PR hacia main, aunque no toquen infraestructura_aws/: el check es obligatorio en la
  # protección de main y, con un filtro de rutas, un PR sin cambios de Terraform quedaba esperando un check
  # que nunca llegaba ("Expected — Waiting for status") y no se podía fusionar. La validación dura ~15 s.
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    paths:
      - 'infraestructura_aws/**'

permissions:
  contents: read

jobs:
  terraform_validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infraestructura_aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend=false
      - run: terraform fmt -check
      - run: terraform validate
