name: Validar Infraestructura (Terraform)
on:
  pull_request:
    paths:
      - 'infraestructura_aws/**'
  push:
    branches: [ "main" ]
    paths:
      - 'infraestructura_aws/**'

permissions:
  contents: read

jobs:
  terraform_validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infraestructura_aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend=false
      - run: terraform fmt -check
      - run: terraform validate
